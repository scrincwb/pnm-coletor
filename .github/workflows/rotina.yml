name: Rotina de hora em hora (alertas e notificações)

# Chama https://paraguainamao.com/api/rotina.php a cada hora: alertas de câmbio,
# notificações automáticas do app (fila da ponte, preço que caiu nos salvos,
# notícia nova do blog) e alertas de preço. Substitui o cron do cPanel.
# Chave em Secrets (ROTINA_CHAVE). ⚠️ Log público: só o código HTTP é impresso.
on:
  schedule:
    - cron: '7 * * * *'   # minuto quebrado: o GitHub atrasa/pula agendamento em minuto redondo
  workflow_dispatch:

jobs:
  rotina:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Rodar a rotina
        env:
          ROTINA_CHAVE: ${{ secrets.ROTINA_CHAVE }}
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' --max-time 290 --retry 2 --retry-delay 20 \
            -X POST -H "X-Chave: $ROTINA_CHAVE" https://paraguainamao.com/api/rotina.php)
          echo "HTTP $codigo"
          [ "$codigo" = "200" ]
