name: Diagnóstico de rede (TEMPORÁRIO)

# Temporário (20/10/2026): descobrir onde o runner é barrado ao falar com o site.
# ⚠️ Log público: o token NUNCA aparece (sem -v nas chamadas com Authorization; o
# GitHub também mascara o segredo). Será apagado logo depois do diagnóstico.
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash {0}
    env:
      COLETOR_TOKEN: ${{ secrets.COLETOR_TOKEN }}
    steps:
      - name: User-Agent x bloqueio (com token, via Cloudflare)
        run: |
          echo "IPv4 do runner: $(curl -s4 --max-time 10 https://api.ipify.org)"
          t() { # $1=UA $2=url
            rm -f /tmp/corpo /tmp/cab
            out=$(curl -s -o /tmp/corpo -D /tmp/cab --max-time 60 -A "$1" -H "Authorization: Bearer $COLETOR_TOKEN" \
              -w 'http=%{http_code} ip=%{remote_ip} tempo=%{time_total}s tamanho=%{size_download}' "$2"; echo " rc=$?")
            echo "=== [$(date -u +%T)] UA='$1' $2 :: $out"
            grep -iE '^(server|cf-ray|content-type|x-turbo)' /tmp/cab 2>/dev/null | tr -d '\r' | sed 's/^/   /'
            if grep -q '"ok"' /tmp/corpo 2>/dev/null; then echo "   resumo: $(grep -oE '"(ok|erro)":[^,}]*' /tmp/corpo | tr '\n' ' ')"
            else echo "   corpo: $(head -c 300 /tmp/corpo 2>/dev/null | tr '\n\r' '  ')"; echo "   título/assinatura: $(grep -oiE '<title>[^<]*</title>|imunify[a-z0-9 ]*|bot verification|recaptcha|one moment|litespeed|access denied[^<]{0,60}' /tmp/corpo 2>/dev/null | sort -u | tr '\n' '|')"; fi
            sleep 3
          }
          W=https://www.paraguainamao.com/api/coletor.php?acao=cambio
          t "curl/8.5.0 (pnm-coletor; +https://www.paraguainamao.com)" "$W"
          t "Wget/1.21.4 (pnm-coletor)" "$W"
          t "pnm-coletor/1.0 curl/8.5.0" "$W"
          t "curl/8.5.0" "$W"

      - name: Python urllib com UA curl (GET e POST), como o coletor faria
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error, time
          tok = os.environ["COLETOR_TOKEN"]
          url = "https://www.paraguainamao.com/api/coletor.php?acao=cambio"
          for ua, metodo in [("curl/8.5.0 (pnm-coletor; +https://www.paraguainamao.com)", "GET"),
                             ("curl/8.5.0 (pnm-coletor; +https://www.paraguainamao.com)", "POST"),
                             ("Wget/1.21.4 (pnm-coletor)", "GET")]:
              h = {"Authorization": "Bearer " + tok, "User-Agent": ua, "Accept": "application/json"}
              data = None
              if metodo == "POST":
                  h["Content-Type"] = "application/json"; data = b"{}"
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, data=data, headers=h, method=metodo), timeout=60)
                  cod, corpo = r.status, r.read(2000).decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  cod, corpo = e.code, e.read(2000).decode("utf-8", "replace")
              except Exception as e:
                  print(f"=== {metodo} UA={ua!r} :: EXCECAO {type(e).__name__}: {e}"); continue
              if corpo.lstrip().startswith("{"):
                  try: j = json.loads(corpo); resumo = f"JSON ok={j.get('ok')} erro={str(j.get('erro'))[:80]}"
                  except Exception: resumo = "JSON inválido"
              else:
                  resumo = "HTML: " + ("Bot Verification" if "Bot Verification" in corpo else corpo[:120].replace("\n", " "))
              print(f"=== {metodo} UA={ua!r} :: http={cod} {resumo}")
              time.sleep(3)
          PY
